name: Session limits source validation (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-limits-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'xue-ding-e/meatshell' && github.ref == 'refs/heads/qa/session-limits-20261011'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7cb3f6dd554c8dd7c7bfa8e60d459d45e0554c26
          persist-credentials: false
      - name: Verify exact product source
        run: test "$(git rev-parse HEAD)" = '7cb3f6dd554c8dd7c7bfa8e60d459d45e0554c26'
      - name: Install official Ubuntu build and loopback-fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake python3-cryptography python3-paramiko \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-limits-qa-rust195
      - name: Full headless Rust unit tests
        run: cargo test --locked --features headless --bin meatshell -- --test-threads=2
      - name: Build exact headless test binary
        run: cargo build --locked --features headless --bin meatshell
      - name: HTTP integration - protocol 2025-06-18
        run: python3 tests/remote_mcp_e2e.py --exe target/debug/meatshell --protocol-version 2025-06-18
      - name: HTTP integration - protocol 2025-11-25
        run: python3 tests/remote_mcp_e2e.py --exe target/debug/meatshell --protocol-version 2025-11-25
      - name: Download checksum-pinned Caddy for loopback TLS only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meatshell-caddy"
          curl --fail --location --retry 3 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/meatshell-caddy/caddy.tar.gz"
          echo "527fbf917c39189a1e3b31d34fa955601680b2d5c8055d2a87b8b9588dec7bb9  $RUNNER_TEMP/meatshell-caddy/caddy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/meatshell-caddy/caddy.tar.gz" -C "$RUNNER_TEMP/meatshell-caddy" caddy
      - name: TLS integration - protocol 2025-06-18
        run: python3 tests/remote_mcp_e2e.py --exe target/debug/meatshell --caddy "$RUNNER_TEMP/meatshell-caddy/caddy" --protocol-version 2025-06-18
      - name: TLS integration - protocol 2025-11-25
        run: python3 tests/remote_mcp_e2e.py --exe target/debug/meatshell --caddy "$RUNNER_TEMP/meatshell-caddy/caddy" --protocol-version 2025-11-25
      - name: Compile complete Slint desktop and Rust integration
        run: cargo check --locked
